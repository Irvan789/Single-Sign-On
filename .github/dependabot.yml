version: 2

multi-ecosystem-groups:
    all-dependencies-group:
        schedule:
            interval: "weekly"
            day: "friday"

updates:
    - package-ecosystem: "composer"
      directory: "/"
      patterns:
          - "*"
      multi-ecosystem-group: "all-dependencies-group"

    - package-ecosystem: "bun"
      directory: "/"
      patterns:
          - "*"
      multi-ecosystem-group: "all-dependencies-group"
