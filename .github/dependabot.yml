version: 2

updates:
    - package-ecosystem: "composer"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "friday"
      groups:
          all-dependencies:
              patterns:
                  - "*"

    - package-ecosystem: "bun"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "friday"
      groups:
          all-dependencies:
              patterns:
                  - "*"
